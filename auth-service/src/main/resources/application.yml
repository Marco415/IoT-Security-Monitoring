# =========================================================
# APPLICATION
# =========================================================

spring:
  application:
    name: auth-service

  # =======================================================
  # DATABASE
  # =======================================================

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_password}
    driver-class-name: org.postgresql.Driver

  # =======================================================
  # JPA / HIBERNATE
  # =======================================================

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# =========================================================
# SERVER
# =========================================================

server:
  port: ${SERVER_PORT:8083}

# =========================================================
# JWT
# =========================================================

jwt:
  # Development secret only.
  # Must be at least 32 bytes.
  # Replace through JWT_SECRET in production.
  secret: ${JWT_SECRET:change-this-development-secret-key-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# =========================================================
# EUREKA
# =========================================================

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

    # Allows Eureka to use the application's health status.
    healthcheck:
      enabled: true

  instance:
    prefer-ip-address: true

    health-check-url-path: /actuator/health

    metadata-map:
      service: auth-service

# =========================================================
# ACTUATOR
# =========================================================

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

# =========================================================
# APPLICATION INFORMATION
# =========================================================

info:
  app:
    name: Authentication Service
    description: IoT Security Authentication Microservice
    version: 0.0.1

# =========================================================
# LOGGING
# =========================================================

logging:
  file:
    name: ${LOGGING_FILE_NAME:/logs/auth-service.log}

  structured:
    format:
      file: logstash

  level:
    root: INFO
    com.iotsecurity.auth: INFO