spring:
  application:
    name: soc-service

  cloud:
    loadbalancer:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://soc-db:5432/soc_db}
    username: ${SPRING_DATASOURCE_USERNAME:soc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:soc_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://neo4j:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:neo4jgraph}

  web:
    resources:
      static-locations:
        - classpath:/static/

soc:
  collector:
    auth:
      fixed-delay-ms: ${SOC_AUTH_COLLECTOR_DELAY_MS:5000}

    event-service:
      enabled: ${SOC_EVENT_SERVICE_COLLECTOR_ENABLED:true}
      poll-interval-ms: ${SOC_EVENT_SERVICE_POLL_INTERVAL_MS:10000}
      batch-size: ${SOC_EVENT_SERVICE_BATCH_SIZE:100}

  event-service:
    internal-api-key: ${SOC_INTERNAL_API_KEY:change-this-internal-soc-key}

  services:
    gateway-url: ${SOC_GATEWAY_URL:http://gateway:8090/actuator/health}
    auth-url: ${SOC_AUTH_URL:http://auth-service:8083/actuator/health}
    auth-events-url: ${SOC_AUTH_EVENTS_URL:http://auth-service:8083/internal/auth-events}
    device-url: ${SOC_DEVICE_URL:http://device-service:8081/actuator/health}
    event-url: ${SOC_EVENT_URL:http://event-service:8082/actuator/health}
    internal-service-key: ${SOC_INTERNAL_SERVICE_KEY:change-this-internal-development-key}

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

info:
  app:
    name: SOC Service
    description: IoT Security Monitoring SOC Service
    version: 0.0.1

logging:
  file:
    name: ${LOGGING_FILE_NAME:/logs/soc-service.log}

  structured:
    format:
      file: logstash

  level:
    root: INFO
    com.iotsecurity.soc: INFO

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true

  show-actuator: true