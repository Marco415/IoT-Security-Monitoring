server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: device-service
              uri: lb://device-service
              predicates:
                - Path=/api/devices/**

            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics