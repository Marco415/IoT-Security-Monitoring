<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IoT Security Monitoring</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <h1>
            IoT Security Monitoring
        </h1>

        <p class="subtitle">
            Microservices Security Monitoring Dashboard
        </p>

    </header>


    <!-- =====================================================
         AUTHENTICATION
         ===================================================== -->

    <section class="card">

        <h2>
            Authentication
        </h2>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
            >

        </div>


        <div class="button-row">

            <button
                type="button"
                id="loginButton"
                class="primary"
            >
                Login
            </button>


            <button
                type="button"
                id="logoutButton"
                class="secondary"
            >
                Logout
            </button>

        </div>

    </section>


    <!-- =====================================================
         DEVICE MANAGEMENT
         ===================================================== -->

    <section class="card">

        <h2>
            Device Management
        </h2>


        <div class="button-row">

            <button
                type="button"
                id="registerDeviceButton"
                class="primary"
            >
                Register Device
            </button>


            <button
                type="button"
                id="viewDevicesButton"
                class="secondary"
            >
                View Devices
            </button>

        </div>


        <div
            id="devicesContainer"
            class="results"
        >

            <p class="placeholder">
                Device information will appear here.
            </p>

        </div>

    </section>


    <!-- =====================================================
         SECURITY EVENTS
         ===================================================== -->

    <section class="card">

        <h2>
            Security Events
        </h2>


        <div class="button-row">

            <button
                type="button"
                id="createEventButton"
                class="danger"
            >
                Create Security Event
            </button>


            <button
                type="button"
                id="viewEventsButton"
                class="secondary"
            >
                View Security Events
            </button>

        </div>


        <div
            id="eventsContainer"
            class="results"
        >

            <p class="placeholder">
                Security event information will appear here.
            </p>

        </div>

    </section>


    <!-- =====================================================
         SYSTEM STATUS
         ===================================================== -->

    <section class="card status-card">

        <h2>
            System Status
        </h2>


        <div class="status-row">

            <strong>
                Gateway:
            </strong>

            <span
                id="gatewayStatus"
                class="status unknown"
            >
                Not tested
            </span>

        </div>


        <div class="status-row">

            <strong>
                Authentication:
            </strong>

            <span
                id="authenticationStatus"
                class="status logged-out"
            >
                Logged out
            </span>

        </div>


        <div class="status-row">

            <strong>
                JWT:
            </strong>

            <span
                id="jwtStatus"
                class="status logged-out"
            >
                Not available
            </span>

        </div>

    </section>


    <!-- =====================================================
         MESSAGE AREA
         ===================================================== -->

    <section
        id="messageContainer"
        class="message-container"
    >

    </section>

</div>


<script src="app.js"></script>

</body>

</html>
