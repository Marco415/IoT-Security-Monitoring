# =========================================================
# APPLICATION
# =========================================================

spring:
  application:
    name: event-service

  # =======================================================
  # DATABASE
  # =======================================================

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/event_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # =======================================================
  # JPA / HIBERNATE
  # =======================================================

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  # =======================================================
  # REST CLIENT
  # =======================================================

  cloud:
    discovery:
      enabled: true


# =========================================================
# SERVER
# =========================================================

server:
  port: 8082


# =========================================================
# EUREKA CLIENT
# =========================================================

eureka:

  client:
    register-with-eureka: true
    fetch-registry: true

    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true


# =========================================================
# DEVICE SERVICE
# =========================================================

client:
  device-service:
    url: http://device-service


# =========================================================
# ACTUATOR / HEALTH CHECKS
# =========================================================

management:

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  health:
    defaults:
      enabled: true


# =========================================================
# LOGGING
# =========================================================

logging:
  level:
    com.iotsecurity.event: INFO
    org.springframework.web: INFO