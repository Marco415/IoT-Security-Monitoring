# =========================================================
# APPLICATION
# =========================================================

spring:
  application:
    name: event-service

  # =======================================================
  # DATABASE
  # =======================================================

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/event_db}
    username: ${SPRING_DATASOURCE_USERNAME:event_user}
    password: ${SPRING_DATASOURCE_PASSWORD:event_password}
    driver-class-name: org.postgresql.Driver

  # =======================================================
  # JPA / HIBERNATE
  # =======================================================

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  # =======================================================
  # REST CLIENT
  # =======================================================

  cloud:
    discovery:
      enabled: true


# =========================================================
# SERVER
# =========================================================

server:
  port: ${SERVER_PORT:8082}


# =========================================================
# EUREKA CLIENT
# =========================================================

eureka:

  client:
    register-with-eureka: true
    fetch-registry: true

    serviceUrl:
      ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true


# =========================================================
# DEVICE SERVICE
# =========================================================

client:
  device-service:
    url: http://device-service


# =========================================================
# ACTUATOR / HEALTH CHECKS
# =========================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

  health:
    defaults:
      enabled: true

    circuitbreakers:
      enabled: true

# =========================================================
# CIRCUIT BREAKER
# =========================================================

resilience4j:

  retry:
    instances:

      deviceServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

  circuitbreaker:
    instances:

      deviceServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

# =========================================================
# LOGGING
# =========================================================

logging:
  file:
    name: ${LOGGING_FILE_NAME:/logs/event-service.log}

  structured:
    format:
      file: logstash

  level:
    root: INFO
    com.iotsecurity.event: INFO